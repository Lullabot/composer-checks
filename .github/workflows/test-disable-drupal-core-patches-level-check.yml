name: Test Disable Drupal Core Patches Level Check

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test-disable-drupal-core-patches-level-check:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: json, mbstring

    - name: Install Composer dependencies
      run: composer install --no-progress --prefer-dist --optimize-autoloader

    # Test 1: Check should FAIL when patchLevel is not configured (no disable flag)
    - name: Test 1 - Build composer.json without patchLevel and without disable flag
      run: |
        mkdir -p test1 && cd test1
        composer init --name="test/project" --no-interaction
        composer config repositories.lullabot/composer-checks '{"type": "path", "url": "../"}'
        composer config allow-plugins.lullabot/composer-checks true
        composer config allow-plugins.cweagans/composer-patches true
        composer require drupal/core:^10.0 --no-update
        composer require cweagans/composer-patches:^1.7 --no-update
        composer require "lullabot/composer-checks:*" --dev --no-update
        composer config minimum-stability dev

        jq '.extra["composer-checks"][1] = "break-composer-installation-if-patches-fail"' composer.json > composer.json.tmp && mv composer.json.tmp composer.json
        jq '.extra["composer-checks"][2] = "disable-exit-on-patch-failure-check"' composer.json > composer.json.tmp && mv composer.json.tmp composer.json

    - name: Test 1 - Verify check fails without disable flag
      run: |
        cd test1
        # Run composer install and expect it to fail (exit code 1)
        echo "=== Running composer install for Test 1 ==="
        set +e  # Disable exit on error
        output=$(composer install --no-progress --ignore-platform-reqs 2>&1)
        exit_code=$?
        set -e  # Re-enable exit on error (if it was set)
        echo "$output"

        # Check if the output contains the expected warning message
        if echo "$output" | grep -q "Configure patches for Composer's packages to use"; then
          echo "✅ Test 1 PASSED: Composer install correctly failed without disable flag (exit code: $exit_code)"
        else
          echo "❌ Test 1 FAILED: Expected warning message but none was shown"
          exit 1
        fi

    # Test 2: Check should PASS (show warning) when disable flag is present
    - name: Test 2 - Build composer.json with disable flag
      run: |
        mkdir -p test2 && cd test2
        composer init --name="test/project" --no-interaction
        composer config repositories.lullabot/composer-checks '{"type": "path", "url": "../"}'
        composer config allow-plugins.lullabot/composer-checks true
        composer config allow-plugins.cweagans/composer-patches true
        composer require drupal/core:^10.0 --no-update
        composer require cweagans/composer-patches:^1.7 --no-update
        composer require "lullabot/composer-checks:*" --dev --no-update
        jq '.extra["composer-checks"][0] = "disable-drupal-core-patches-level-check"' composer.json > composer.json.tmp && mv composer.json.tmp composer.json
        jq '.extra["composer-checks"][1] = "break-composer-installation-if-patches-fail"' composer.json > composer.json.tmp && mv composer.json.tmp composer.json
        jq '.extra["composer-checks"][2] = "disable-exit-on-patch-failure-check"' composer.json > composer.json.tmp && mv composer.json.tmp composer.json

        composer config minimum-stability dev

    - name: Test 2 - Verify check shows warning with disable flag
      run: |
        cd test2
        # Run composer install and expect it to succeed with warnings
        echo "=== Running composer install for Test 2 ==="
        set +e  # Disable exit on error
        output=$(composer install --no-progress --ignore-platform-reqs 2>&1)
        exit_code=$?
        set -e  # Re-enable exit on error (if it was set)
        echo "$output"

        # Check if the output contains the expected warning message
        if echo "$output" | grep -q "Configure patches for Composer's packages to use"; then
          echo "✅ Test 2 PASSED: Composer install succeeded and showed warning with disable flag (exit code: $exit_code)"
        else
          echo "❌ Test 2 FAILED: Expected warning message but none was shown"
          exit 1
        fi

    # Test 3: Check should PASS silently when patchLevel is correctly configured
    - name: Test 3 - Build composer.json with correct patchLevel configuration
      run: |
        mkdir -p test3 && cd test3
        composer init --name="test/project" --no-interaction
        composer config repositories.lullabot/composer-checks '{"type": "path", "url": "../"}'
        composer config allow-plugins.lullabot/composer-checks true
        composer config allow-plugins.cweagans/composer-patches true
        composer require drupal/core:^10.0 --no-update
        composer require cweagans/composer-patches:^1.7 --no-update
        composer require "lullabot/composer-checks:*" --dev --no-update
        jq '.extra.patchLevel["drupal/core"] = "-p2"' composer.json > composer.json.tmp && mv composer.json.tmp composer.json

        composer config minimum-stability dev

        # avoid It's recommended to break Composer's installation if patches don't apply.
        jq '.extra["composer-checks"][1] = "break-composer-installation-if-patches-fail"' composer.json > composer.json.tmp && mv composer.json.tmp composer.json
        jq '.extra["composer-checks"][2] = "disable-exit-on-patch-failure-check"' composer.json > composer.json.tmp && mv composer.json.tmp composer.json


    - name: Test 3 - Verify check passes with correct configuration
      run: |
        cd test3
        # Run composer install and expect it to succeed without warnings about patchLevel
        echo "=== Running composer install for Test 3 ==="
        set +e  # Disable exit on error
        output=$(composer install --no-progress --ignore-platform-reqs 2>&1)
        exit_code=$?
        set -e  # Re-enable exit on error (if it was set)
        echo "$output"

        # Check if the output doesn't contain the expected warning message
        if echo "$output" | grep -q "Configure patches for Composer's packages to use"; then
          echo "❌ Test 3 FAILED: Expected warning message but none was shown"
          exit 1
        else
          echo "✅ Test 3 PASSED: Composer install succeeded without warnings about patchLevel"
        fi

    # Test 4: Check should FAIL when patchLevel is configured but incorrect value
    - name: Test 4 - Build composer.json with incorrect patchLevel value
      run: |
        mkdir -p test4 && cd test4
        composer init --name="test/project" --no-interaction
        composer config repositories.lullabot/composer-checks '{"type": "path", "url": "../"}'
        composer config allow-plugins.lullabot/composer-checks true
        composer config allow-plugins.cweagans/composer-patches true
        composer require drupal/core:^10.0 --no-update
        composer require cweagans/composer-patches:^1.7 --no-update
        composer require "lullabot/composer-checks:*" --dev --no-update
        jq '.extra.patchLevel["drupal/core"] = "-p1"' composer.json > composer.json.tmp && mv composer.json.tmp composer.json

        # Avoid other checks
        jq '.extra["composer-checks"][1] = "break-composer-installation-if-patches-fail"' composer.json > composer.json.tmp && mv composer.json.tmp composer.json
        jq '.extra["composer-checks"][2] = "disable-exit-on-patch-failure-check"' composer.json > composer.json.tmp && mv composer.json.tmp composer.json

        composer config minimum-stability dev

    - name: Test 4 - Verify check fails with incorrect patchLevel value
      run: |
        cd test4
        # Run composer install and expect it to fail
        echo "=== Running composer install for Test 4 ==="
        set +e  # Disable exit on error
        output=$(composer install --no-progress --ignore-platform-reqs 2>&1)
        exit_code=$?
        set -e  # Re-enable exit on error (if it was set)
        echo "$output"

        # Check if the output contains the expected warning message
        if echo "$output" | grep -q "Configure patches for Composer's packages to use"; then
          echo "✅ Test 4 PASSED: Composer install correctly failed without disable flag (exit code: $exit_code)"
        else
          echo "❌ Test 4 FAILED: Expected warning message but none was shown"
          exit 1
        fi

    # Test 5: Verify the composer.json files were built correctly
    - name: Test 5 - Show generated composer.json files for verification
      run: |
        echo "=== Test 1 composer.json ==="
        cat test1/composer.json | jq .
        echo -e "\n=== Test 2 composer.json ==="
        cat test2/composer.json | jq .
        echo -e "\n=== Test 3 composer.json ==="
        cat test3/composer.json | jq .
        echo -e "\n=== Test 4 composer.json ==="
        cat test4/composer.json | jq .

    - name: Cleanup test directories
      run: |
        rm -rf test1 test2 test3 test4
